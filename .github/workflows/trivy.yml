name: Trivy

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # lunes 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Trivy, fail on HIGH or CRITICAL
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" -w /src \
            ghcr.io/aquasecurity/trivy:0.65.0 fs \
            --scanners vuln,secret,misconfig \
            --severity CRITICAL,HIGH \
            --exit-code 1 --no-progress .

      - name: SARIF report for GitHub Security
        if: always()
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" -w /src \
            ghcr.io/aquasecurity/trivy:0.65.0 fs \
            --scanners vuln,secret,misconfig \
            --severity CRITICAL,HIGH,MEDIUM \
            --format sarif --output trivy-results.sarif \
            --no-progress .

      - name: Upload results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-results.sarif
